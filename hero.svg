<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Rounded warning triangle -->
  <path d="M120 40 L190 148 L50 148 Z" 
        fill="#d32f2f" 
        stroke="#d32f2f" 
        stroke-width="18" 
        stroke-linejoin="round" 
        filter="url(#shadow)"/>

  <!-- White exclamation mark -->
  <text x="120" y="136" text-anchor="middle" 
        fill="white" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="80" 
        font-weight="bold">!</text>

  <!-- Bold white main text -->
  <text x="120" y="187" text-anchor="middle" 
        fill="white" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="14" 
        font-weight="bold"
        letter-spacing="0.8">The system has been destroyed</text>

  <!-- Semi-transparent subtitle -->
  <text x="120" y="204" text-anchor="middle" 
        fill="rgba(255,255,255,0.55)" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="10" 
        font-weight="normal"
        letter-spacing="0.4">Press power button to shutdown</text>
</svg>
