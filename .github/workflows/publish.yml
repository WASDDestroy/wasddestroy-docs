name: Publish to Website

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # tb710fu-doc 是子模块，必须拉取

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm docs:build

      # VitePress 只复制 public/，logo 不在其中，手动补齐
      # 若日后把两个文件挪进 public/（public/hero.svg、public/tb710fu-doc/logo.jpg），可删除本步骤
      - name: Copy logo assets
        run: |
          cp hero.svg .vitepress/dist/hero.svg
          cp tb710fu-doc/logo.jpg .vitepress/dist/tb710fu-doc/logo.jpg

      - name: Add .htaccess
        run: printf 'ErrorDocument 404 /404.html\n' > .vitepress/dist/.htaccess

      - name: Package
        run: cd .vitepress/dist && zip -qr ../dist.zip .

      # 只上传单个 zip，避免 FTP 传大量小文件
      # -d 开启调试但输出经过 sed 过滤：把服务器 IP（FTP_SERVER 解析结果）替换为 ***，
      # GitHub 只会自动遮蔽 secret 的原值（域名），不会遮蔽解析出的 IP
      # 注意：38MB 产物在国内虚拟主机海外线路上传可能需要 5-15 分钟，日志无刷新属正常
      - name: Upload zip via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          set -o pipefail
          ips=$(dig +short "$FTP_SERVER" | grep -E '^[0-9.]+$' | paste -sd '|')
          # dig 失败时给个无害的兜底值，保证 sed 表达式合法
          ips=${ips:-255.255.255.255}
          lftp -d \
            -e "set ftp:ssl-allow no; \
                set ftp:passive-mode on; \
                set net:timeout 60; \
                set net:max-retries 3; \
                set net:reconnect-interval-base 5; \
                rm -f /wwwroot/dist.zip; \
                put -c -O /wwwroot/ .vitepress/dist.zip; bye" \
            -u "$FTP_USERNAME,$FTP_PASSWORD" \
            "$FTP_SERVER" 2>&1 \
            | sed -E "s/${ips//./\\.}/***/g; s/[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+,[0-9]+/***,***/g"

      # 触发服务器上的 deploy.php 解压并清理
      - name: Trigger remote unzip
        run: |
          for i in 1 2 3; do
            if curl -fsS -X POST -d "token=${{ secrets.DEPLOY_TOKEN }}" "https://${{ secrets.DEPLOY_URL }}/deploy.php"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
